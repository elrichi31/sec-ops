# Zenlor collector: reads proxy logs, normalizes to the Zenlor fields, ships OTLP/JSON.
# Normalized attributes: source, service, host, clientIp, method, path (with query), statusCode, durationMs, userAgent
# Missing log files are fine: that receiver just stays idle.
#
# Nginx needs a JSON access log (CF-Connecting-IP is trusted only from Cloudflare peers, checked in the backend):
#   log_format zenlor escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
#     '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"request_time":$request_time,'
#     '"cf_connecting_ip":"$http_cf_connecting_ip","user_agent":"$http_user_agent"}';
#   access_log /var/log/nginx/zenlor.json.log zenlor;
#
# Traefik needs: --accesslog=true --accesslog.format=json --accesslog.filepath=/var/log/traefik/access.log
#   --accesslog.fields.headers.names.Cf-Connecting-Ip=keep   (real client IP behind Cloudflare)
#   --accesslog.fields.headers.names.User-Agent=keep         (attack tool detection)

receivers:
  file_log/nginx:
    include: [/logs/nginx/*.json.log]
    attributes: { source: nginx }
    operators:
      - type: json_parser
        timestamp: { parse_from: attributes.time, layout_type: gotime, layout: "2006-01-02T15:04:05Z07:00" }

  file_log/traefik:
    include: [/logs/traefik/access.log]
    attributes: { source: traefik }
    operators:
      - type: json_parser
        timestamp: { parse_from: attributes.time, layout_type: gotime, layout: "2006-01-02T15:04:05Z07:00" }

processors:
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        conditions: ['attributes["source"] == "nginx"']
        statements:
          - set(attributes["clientIp"], attributes["remote_addr"])
          - set(attributes["cfConnectingIp"], attributes["cf_connecting_ip"])
          - set(attributes["service"], attributes["host"])
          - set(attributes["path"], attributes["uri"])
          - set(attributes["userAgent"], attributes["user_agent"])
          - set(attributes["statusCode"], Int(attributes["status"]))
          - set(attributes["durationMs"], Int(Double(attributes["request_time"]) * 1000))
      - context: log
        conditions: ['attributes["source"] == "traefik"']
        statements:
          - set(attributes["clientIp"], attributes["ClientHost"])
          # needs accessLog.fields.headers.names.Cf-Connecting-Ip: keep (backend verifies the peer is Cloudflare)
          - set(attributes["cfConnectingIp"], attributes["request_Cf-Connecting-Ip"])
          - set(attributes["service"], attributes["ServiceName"])
          # Host the client asked for; with no ServiceName it was not routed (scanners, open-proxy probes)
          - set(attributes["host"], attributes["RequestHost"])
          - set(attributes["method"], attributes["RequestMethod"])
          - set(attributes["path"], attributes["RequestPath"])
          - set(attributes["userAgent"], attributes["request_User-Agent"])
          - set(attributes["statusCode"], Int(attributes["DownstreamStatus"]))
          - set(attributes["durationMs"], Int(attributes["Duration"] / 1000000))
  batch:
    timeout: 5s

exporters:
  otlp_http:
    endpoint: ${env:ZENLOR_ENDPOINT}
    encoding: json
    compression: none
    headers:
      Authorization: Bearer ${env:ZENLOR_INGEST_KEY}

service:
  pipelines:
    logs:
      receivers: [file_log/nginx, file_log/traefik]
      processors: [transform, batch]
      exporters: [otlp_http]
